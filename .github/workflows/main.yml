name: Android Release Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x gradlew

      # NEW: keystore ko GitHub Secret (base64) se decode karke
      # app/ folder mein rakhta hai, taake build.gradle ka
      # storeFile file("keystore.jks") ise dhoond sake.
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      - name: Build release APK
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: List build outputs (debug)
        run: find app/build/outputs -type f -name "*.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: EboneDealerPanel-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error