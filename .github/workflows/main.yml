name: Android Release Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

# NEW: workflow ko GitHub Release banane/update karne ki permission chahiye
permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x gradlew

      # NEW: keystore ko GitHub Secret (base64) se decode karke
      # app/ folder mein rakhta hai, taake build.gradle ka
      # storeFile file("keystore.jks") ise dhoond sake.
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      - name: Build release APK
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: List build outputs (debug)
        run: find app/build/outputs -type f -name "*.apk"

      - name: Upload release APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: EboneDealerPanel-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # NEW: app/build.gradle se versionName (e.g. "1.0.3") nikalta hai
      # taake Release ka tag hamesha app ke actual version se match kare.
      - name: Read versionName from build.gradle
        id: version
        run: |
          VERSION_NAME=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle)
          echo "Detected versionName: $VERSION_NAME"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      # NEW: har push par khud-ba-khud GitHub Release banata/update karta
      # hai, tag "v1.0.3" jaisa, aur usme signed APK attach kar deta hai.
      # Agar isi version ka Release pehle se ho to yeh usko update kar
      # dega (duplicate release nahi banega).
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: Release v${{ steps.version.outputs.version_name }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true