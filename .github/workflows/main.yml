name: Android Release Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

# NEW: workflow ko GitHub Release banane/update karne ki permission chahiye
permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x gradlew

      # Decode GitHub Secret keystore
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      # TEMPORARY: Verify that GitHub is using the correct signing key
      - name: Verify signing key
        run: |
          keytool -list -v \
            -keystore app/keystore.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" |
            grep -E "Alias name:|SHA256:"

      - name: Build release APK
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: List build outputs (debug)
        run: find app/build/outputs -type f -name "*.apk"

      - name: Upload release APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: EboneDealerPanel-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Read versionName from build.gradle
      - name: Read versionName from build.gradle
        id: version
        run: |
          VERSION_NAME=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle)
          echo "Detected versionName: $VERSION_NAME"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      # Create or update GitHub Release
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: Release v${{ steps.version.outputs.version_name }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true