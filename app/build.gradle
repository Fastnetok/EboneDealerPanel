apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.ebone.dealerpanel'
    compileSdk 34
    defaultConfig {
        applicationId 'com.ebone.dealerpanel'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.0.3'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    // NEW: required for `import kotlinx.coroutines.tasks.await` — this is
    // what lets code do `firestoreTask.await()` inside a coroutine. Used
    // 6 times in DealerRepo.kt (dealer(), register(), methods(), save(),
    // used()). Without this, every single one of those fails to compile
    // with "Unresolved reference: await".
    // NEW: required for VersionChecker's GitHub Releases API call + APK
    // download (same auto-update system as EboneAdminPanel/CustomerIDApp).
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'
}
// test